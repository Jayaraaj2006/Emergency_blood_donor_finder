<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emergency Blood Finder</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <h1>Emergency Blood Finder</h1>
        <nav>
          <a href="#home">Home</a>
          <a href="#donors">Donors</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main class="container" id="home">
      <section class="hero">
        <div>
          <p class="eyebrow">Fast and local</p>
          <h2>Find available donors quickly.</h2>
          <p>
            Search by blood group and city to locate donors in your area.
          </p>
          <form id="searchForm" class="filters">
            <input type="text" id="bloodGroup" placeholder="Blood Group (O+, A+...)" />
            <input type="text" id="city" placeholder="City" />
            <button type="submit">Search</button>
          </form>
        </div>
      </section>

      <section id="donors" class="donor-section">
        <h3>Available Donors</h3>
        <div id="donorList" class="donor-list"></div>
      </section>
    </main>

    <footer id="contact" class="footer">
      <div class="container">
        <p>Built for fast emergency coordination.</p>
      </div>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
